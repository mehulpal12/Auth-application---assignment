version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: auth_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://neondb_owner:npg_uFN4AfL7kwZO@ep-weathered-credit-axs16xeq-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require"
      JWT_SECRET: "super-secret-auth-jwt-key-2026-change-in-production"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NOTE: Next.js bakes NEXT_PUBLIC_ variables into the bundle at BUILD time.
        # Change localhost:5000 to your backend domain once hosted on cloud.
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    container_name: auth_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend